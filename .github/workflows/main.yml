name: Build Android APK

on:
  push:
    branches: [ "main", "feature/localization-zh" ]
  workflow_dispatch: # 允许你随时手动点击按钮来编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android NDK & CMake
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Prepare Artifact Name
      run: |
        NAME="MINI2-Thermal-App-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
        echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_ENV"

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: app/build/outputs/apk/debug/app-debug.apk